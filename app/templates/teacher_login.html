<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老师入口</title>
<style>
body{font-family:sans-serif;max-width:520px;margin:60px auto;padding:0 18px;color:#222}
.card{background:#fff;border:1px solid #dfe3e7;border-radius:8px;padding:20px}
label{display:block;margin:12px 0 5px;color:#555}
input,button{font-size:16px;padding:9px 10px;box-sizing:border-box}
input{width:100%}
button{margin-top:14px;background:#1a5fb4;color:#fff;border:0;border-radius:5px;cursor:pointer}
.error{color:#b3261e;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>老师入口</h1>
  {% if required_token %}
  <p>请输入老师访问令牌。</p>
  {% if error %}<p class="error">令牌不正确，请重试。</p>{% endif %}
  <form method="post" action="/teacher/login">
    <label for="token">访问令牌</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required>
    <button type="submit">进入老师工作台</button>
  </form>
  {% else %}
  <p>当前为本地演示模式，无需令牌。</p>
  <form method="post" action="/teacher/login">
    <button type="submit">进入老师工作台</button>
  </form>
  {% endif %}
</div>
</body>
</html>
